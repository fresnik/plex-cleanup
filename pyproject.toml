[project]
name = "plex-cleanup"
version = "0.1.0"
description = "CLI to find cleanup candidates in a Plex media library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "plexapi>=4.15",
    "python-dotenv>=1.2.3",
]

[project.scripts]
plex-cleanup = "plex_cleanup.cli:app"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_cleanup"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.10"
